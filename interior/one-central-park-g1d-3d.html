<style>
/* Layout: full-height 3D stage on the left, spec sheet (plan, packages, selected piece with options, schedule) on the right; stacks on phones. */
:root {

  --font-body: "Noto Sans KR", "Noto Sans SC", "Manrope", "PingFang SC", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171A; --panel: #1B1F23; --fg: #E8EBED; --muted: #9AA2A9; --line: #2D3338;
    --accent: #CDA770; --accent-ink: #17140F; --accent-soft: #2E2820; --stage: #20252A; --chip: #262B30;
    --label-bg: rgba(27, 31, 35, 0.88); --ok: #8CC09A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171A; --panel: #1B1F23; --fg: #E8EBED; --muted: #9AA2A9; --line: #2D3338;
  --accent: #CDA770; --accent-ink: #17140F; --accent-soft: #2E2820; --stage: #20252A; --chip: #262B30;
  --label-bg: rgba(27, 31, 35, 0.88); --ok: #8CC09A; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
:lang(zh) body, html[lang="zh"] body { font-family: "Noto Sans SC", var(--font-body); }

button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 410px; grid-template-rows: auto minmax(0, 1fr); }
.bar { grid-column: 1; grid-row: 1; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 20px;
  padding-block: 12px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; border-bottom: 1px solid var(--line); }
.eyebrow { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.06em; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.01em; margin: 2px 0 0; text-wrap: balance; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 6px 10px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg button:hover:not([aria-pressed="true"]) { background: var(--chip); }
.seg button.walk { font-weight: 700; color: var(--accent); }
.seg button.walk[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); }

.stage { grid-column: 1; grid-row: 2; position: relative; min-height: 0; background: var(--stage); overflow: hidden; user-select: none; -webkit-user-select: none; }
.stage canvas { display: block; touch-action: none; }
.css2d { position: absolute; inset: 0; pointer-events: none; }
.hint { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: 66px; width: fit-content; bottom: 12px; font-size: 11.5px; color: var(--muted);
  background: var(--label-bg); padding: 4px 9px; border-radius: 6px; pointer-events: none; }
.hint b { color: var(--fg); font-weight: 700; }
.walkbar { position: absolute; top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); right: 12px; width: fit-content; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--accent); color: var(--accent-ink); padding: 6px 6px 6px 12px; border-radius: 8px; font-size: 12.5px; }
.walkbar button { border: 0; border-radius: 6px; padding: 4px 10px; background: var(--accent-ink); color: var(--accent); font-weight: 700; cursor: pointer; }
.toast { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 5px 12px; border-radius: 6px; font-size: 12px; pointer-events: none; }
.manbar { position: absolute; top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); right: 12px; width: fit-content; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center;
  background: var(--label-bg); border: 1px solid var(--line); border-radius: 10px; padding: 5px 6px 5px 10px; font-size: 12px; color: var(--muted); backdrop-filter: blur(6px); }
.manbar .seg button { padding: 4px 9px; font-size: 12px; }
.manview { border: 0; border-radius: 7px; padding: 5px 10px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 12px; cursor: pointer; }
.walking .manbar { display: none; }
.toggle.edit { color: var(--accent); font-weight: 700; }
.editbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 50px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; align-items: center;
  max-width: calc(100% - 24px); background: var(--label-bg); border: 1px solid var(--accent); border-radius: 10px; padding: 6px 8px; backdrop-filter: blur(6px); }
.editbar button { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 5px 9px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.editbar button:hover { border-color: var(--accent); }
.editbar button:disabled { opacity: 0.45; cursor: default; }
.editbar .ebl { font-size: 12px; font-weight: 700; padding: 0 4px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.editing canvas { cursor: move; }
.compass { position: absolute; right: 14px; bottom: 12px; width: 42px; height: 42px; pointer-events: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }

.rl { pointer-events: none; text-align: center; transform: translateY(-2px); }
.rl b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 12px; color: var(--fg); letter-spacing: 0.01em; }
.rl span { display: block; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.rl .py { font-family: var(--font-body); font-style: italic; font-size: 10px; color: var(--accent); }
.rl.dim b { color: var(--muted); font-weight: 500; }
.rl.changed b { color: var(--accent); }
.walking .rl { display: none; }
.fl { display: none; pointer-events: none; background: var(--label-bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px;
  font-size: 11px; white-space: nowrap; color: var(--fg); backdrop-filter: blur(4px); }
.fl i { font-style: normal; color: var(--muted); }
.show-all .fl, .fl.sel { display: block; }
.fl.sel { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.fl.sel i { color: var(--accent-ink); opacity: 0.8; }

.side { grid-column: 2; grid-row: 1 / 3; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; min-width: 0;
  padding-block: 14px 28px; padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
.sec-h { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.langbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

.plans { display: flex; flex-direction: column; gap: 8px; }
.plan-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.plan-row select, .plan-row input { flex: 1 1 140px; min-width: 0; border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; background: var(--bg); }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 6px 10px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn:disabled { opacity: 0.5; cursor: default; }
.plan-status { font-size: 12px; color: var(--muted); }
.plan-status.ok { color: var(--ok); }
.packs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pack { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 8px 9px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pack:hover { border-color: var(--muted); }
.pack[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.pack b { font-size: 12.5px; }
.pack span { font-family: var(--font-mono); font-size: 12px; }
.pack small { font-size: 11px; color: var(--muted); }

.gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.gallery button { border: 0; padding: 0; background: none; cursor: zoom-in; text-align: left; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.gallery img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 7px; border: 1px solid var(--line); background: var(--chip); }
.gallery span { font-size: 11.5px; color: var(--muted); }
.lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(10, 12, 14, 0.92); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.lightbox figure { margin: 0; max-width: 100%; max-height: 100%; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.lightbox img { max-width: 100%; max-height: 82vh; border-radius: 8px; }
.lightbox figcaption { color: #E8EBED; font-size: 13px; text-align: center; }
.lightbox button { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); border: 0; border-radius: 50%; width: 38px; height: 38px; background: #E8EBED; color: #14171A; font-size: 16px; cursor: pointer; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 14px 15px; background: var(--bg); display: flex; flex-direction: column; gap: 11px; }
.card .top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.pill.fixed { background: var(--accent); color: var(--accent-ink); }
.pill.prop { background: var(--accent-soft); color: var(--accent); }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1.2; }
.model { font-size: 15px; font-weight: 500; }
.py { font-style: italic; color: var(--accent); font-size: 0.92em; }
.kv { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 5px 10px; font-size: 12.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.price { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 3px; }
.price .big { font-family: var(--font-display); font-weight: 800; font-size: 21px; font-variant-numeric: tabular-nums; }
.price .big small { font-family: var(--font-mono); font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 6px; }
.price .pnote { font-size: 12px; color: var(--muted); }
.price .links { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; }
.note { font-size: 13px; border-top: 1px solid var(--line); padding-top: 10px; }
.shop { font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 2px; }
.shop b { font-size: 12px; color: var(--muted); font-weight: 500; }
.opts { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.opts .h { font-size: 12px; color: var(--muted); }
.opt { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 2px 8px; align-items: baseline; text-align: left; width: 100%;
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 8px 10px; cursor: pointer; }
.opt:hover { border-color: var(--muted); }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted); align-self: center; }
.opt[aria-checked="true"] .dot { border-color: var(--accent); background: var(--accent); }
.opt .t { font-weight: 700; font-size: 13px; min-width: 0; }
.opt .t span { font-weight: 400; color: var(--muted); }
.opt .p { font-family: var(--font-mono); font-size: 12px; white-space: nowrap; }
.opt .s { grid-column: 2 / 4; font-size: 11.5px; color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { border-top: 2px solid var(--fg); padding-top: 6px; min-width: 0; }
.stat b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 19px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11.5px; color: var(--muted); }

.room { border-top: 1px solid var(--line); padding-top: 10px; }
.room + .room { margin-top: 12px; }
.room-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.room-h b { font-family: var(--font-display); font-weight: 700; font-size: 13.5px; }
.room-h b em { font-style: normal; color: var(--accent); font-size: 11px; margin-left: 6px; }
.room-h span { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.items button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 7px; padding: 6px 8px; cursor: pointer;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; align-items: baseline; }
.items button:hover { background: var(--chip); }
.items button[aria-current="true"] { background: var(--accent-soft); }
.items .b { font-weight: 700; font-size: 13px; min-width: 0; }
.items .m { color: var(--muted); font-weight: 400; }
.items .c { font-size: 11.5px; color: var(--muted); grid-column: 1; }
.items .c .o { color: var(--accent); }
.items .d { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg); grid-row: 1 / 3; grid-column: 2; align-self: center; text-align: right; }
.items .d.q { color: var(--muted); }
.items .star { color: var(--accent); }
.foot { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.foot p { margin: 0 0 6px; }

@media (max-width: 880px) {
  html, body { height: auto; }
  .app { display: block; height: auto; }
  .bar { padding-right: max(16px, env(safe-area-inset-right, 0px)); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const v = x / 1e8, s = (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)).replace(/\.?0+$/, '');
    return s + (ko ? (short ? '억' : '억 원') : (short ? '亿' : '亿韩元'));
  }
  const m = Math.round(x / 1e4).toLocaleString('en-US');
  return m + (ko ? (short ? '만' : '만 원') : (short ? '万' : '万韩元'));
}
const fmtOrig = p => p.cur === 'KRW' ? '' : (SYM[p.cur] || '') + Math.round(p.v).toLocaleString('en-US');
function qtyOf(it) { if (!it.slot) return 1; return SLOTS[it.slot].per === 'set' ? 1 : ITEMS.filter(i => i.slot === it.slot).length; }
function totalFor(choice) {
  let total = 0, quote = 0, unknown = 0;
  const seen = new Set();
  for (const it of ITEMS) {
    let price = it.price, key = it.id;
    if (it.slot) { price = PRODUCTS[choice[it.slot]].price; if (SLOTS[it.slot].per === 'set') key = 'slot:' + it.slot; }
    if (seen.has(key)) continue; seen.add(key);
    if (!price) unknown++; else if (price.v == null) quote++; else total += krw(price);

  return { total, quote, unknown };
}

let db = null, plansCol = null, planDocs = [], planState = 'loading';

const planSelect = document.getElementById('plan-select'), planName = document.getElementById('plan-name');

  store.set('g1d-choice2', JSON.stringify(CHOICE));
  store.set('g1d-layout', JSON.stringify(LAYOUT));

  const ref = plansCol.doc(activePlan), body = { choice: { ...CHOICE }, layout: { ...LAYOUT }, updatedAt: new Date().toISOString() };

  let msg = t.planLocal, ok = false;

    activePlan = ref.id; store.set('g1d-plan', activePlan); planName.value = '';
    planDocs = planDocs.filter(p => p.id !== ref.id).concat([{ id: ref.id, name, choice: { ...CHOICE } }]);

document.getElementById('plan-rename').addEventListener('click', async () => {

(async () => {
  const timer = setTimeout(() => { if (planState === 'loading') { planState = 'offline'; renderPlans(); } }, 10000);
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { clearTimeout(timer); planState = 'offline'; renderPlans(); return; }
  plansCol = db.collection('plans');
  plansCol.onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    if (planState === 'loading' && !snap.metadata.fromCache) planState = 'ready';
    planDocs = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => p.name).sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
    const p = planDocs.find(x => x.id === activePlan);
    if (p && JSON.stringify(validLayout(p.layout)) !== JSON.stringify(LAYOUT) && !dragging) applyLayout(p.layout);
    if (p && p.choice && JSON.stringify(validChoice(p.choice)) !== JSON.stringify(CHOICE)) applyChoices(p.choice, false);
    else renderPlans();
  }, () => { clearTimeout(timer); planState = 'offline'; renderPlans(); });
})();
