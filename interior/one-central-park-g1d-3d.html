.foot { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }

  t.repeat.set(1 / repeatM, 1 / repeatM);

    bx(g, w, 0.3, d - hb, 0, 0, hb / 2, frame, 0.03);
    bx(g, w - 0.1, 0.24, d - hb - 0.1, 0, 0.3, hb / 2, white, 0.05);
    bx(g, w - 0.06, 0.07, (d - hb) * 0.6, 0, 0.53, d / 2 - (d - hb) * 0.3 - 0.03, linen, 0.03);
    bx(g, w, h, hb, 0, 0, -d / 2 + hb / 2, frame, 0.03);
    const n = w > 2 ? 3 : 2;
    for (let k = 0; k < n; k++) bx(g, (w - 0.3) / n, 0.14, 0.42, -w / 2 + 0.15 + (w - 0.3) / n * (k + 0.5), 0.53, -d / 2 + hb + 0.28, white, 0.06);
  },
  cabinet(g, w, d, h, it) {
    const c = M(it.c1, 0.55);
    if (it.style === 'open') {
      bx(g, w, h, 0.03, 0, 0, -d / 2 + 0.015, c);
      for (const s of [-1, 1]) bx(g, 0.03, h, d, s * (w / 2 - 0.015), 0, 0, c);
      bx(g, w, 0.03, d, 0, h - 0.03, 0, c);
      bx(g, w, 0.25, d, 0, 0, 0, c);
      bx(g, w - 0.06, 0.02, d - 0.05, 0, 1.75, 0, M(it.c2, 0.4));
      bx(g, w - 0.06, 0.012, 0.012, 0, 1.6, 0, chrome());
      for (let k = 0; k < Math.floor(w / 0.18); k++) bx(g, 0.05, 0.8, d * 0.75, -w / 2 + 0.12 + k * 0.18, 0.8, 0, M(['#3C4652', '#D9D3C7', '#6E5E50', '#22252A'][k % 4], 0.95));
      return;
    }
    bx(g, w, h, d, 0, 0, 0, c, 0.008);
    if (it.style === 'counter') bx(g, w + 0.02, 0.03, d + 0.02, 0, h - 0.03, 0, M(it.c2, 0.35));
    const n = Math.max(1, Math.round(w / 0.6));
    const seam = M('#000000', 0.9, 0, { transparent: true, opacity: 0.35 });
    for (let k = 1; k < n; k++) bx(g, 0.004, h - 0.06, 0.004, -w / 2 + k * w / n, 0.03, d / 2 + 0.002, seam, 0, false);
  },
  island(g, w, d, h, it) {
    bx(g, w - 0.04, h - 0.04, d - 0.32, 0, 0, -0.15, M(it.c1, 0.55), 0.008);
    bx(g, w, 0.04, d, 0, h - 0.04, 0, M(it.c2, 0.3), 0.005);
  },
  tv(g, w, d, h, it) {
    const e = it.elev || 0;
    bx(g, w, h * 0.62, 0.035, 0, e + 0.1, 0, M(it.c1, 0.15, 0.3));
    bx(g, w * 0.98, 0.1, 0.06, 0, e, 0.01, M(it.c2, 0.6, 0.3));
  },
  speaker(g, w, d, h, it) {
    cyl(g, w / 2 * 0.6, w / 2, h, 0, 0, 0, M(it.c1, 0.35, 0.7));
    cyl(g, w / 2 * 0.9, w / 2 * 0.6, 0.06, 0, h, 0, M('#888B8E', 0.3, 0.8));
  },
  rug(g, w, d, h, it) { const m = bx(g, w, 0.012, d, 0, 0.006, 0, M(it.c1, 1), 0, false); m.castShadow = false; },
  arco(g, w, d, h, it) {
    bx(g, 0.42, 0.3, 0.26, 0, 0, 0, M(it.c1, 0.25), 0.02);
    const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0.3, 0), new THREE.Vector3(0, 1.4, 0.15), new THREE.Vector3(0, 2.2, 0.8), new THREE.Vector3(0, 2.35, 1.5), new THREE.Vector3(0, 2.1, 2.05)]);
    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.012, 8), chrome()); tube.castShadow = true; g.add(tube);
    const shade = new THREE.Mesh(new THREE.SphereGeometry(0.2, 32, 12, 0, Math.PI * 2, 0, Math.PI / 2), M(it.c2, 0.2, 0.95, { side: THREE.DoubleSide }));
    shade.position.set(0, 2.0, 2.1); shade.castShadow = true; g.add(shade);
    const bulb = new THREE.Mesh(new THREE.CircleGeometry(0.17, 24), M('#FFF2D6', 1, 0, { emissive: '#FFE7B8', emissiveIntensity: 1.4 }));
    bulb.rotation.x = Math.PI / 2; bulb.position.set(0, 1.99, 2.1); g.add(bulb);
  },
  pendant(g, w, d, h, it) {
    const glow = M('#FFF6E6', 0.1, 0, { emissive: it.c1, emissiveIntensity: 1.6 });
    const glass = new THREE.MeshPhysicalMaterial({ color: '#E8EEF0', roughness: 0.05, transparent: true, opacity: 0.35 });
    const pts = [[0, 0, 2.05], [0.32, 0.1, 2.2], [-0.3, 0.18, 2.12], [0.12, -0.34, 2.28], [-0.18, -0.26, 2.0], [0.38, -0.2, 2.1], [-0.42, -0.04, 2.25]];
    for (const [x, z, y] of pts) {
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.1, 24, 16), glass); s.position.set(x, y, z); g.add(s);
      const c = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 8), glow); c.position.set(x, y, z); g.add(c);
      const wire = new THREE.Mesh(new THREE.CylinderGeometry(0.002, 0.002, 3.0 - y - 0.1, 4), darkMetal()); wire.position.set(x, (3.0 + y + 0.1) / 2, z); g.add(wire);
    }
    const L = new THREE.PointLight('#FFE2B0', 8, 7, 1.6); L.position.set(0, 2.0, 0); g.add(L);
  },
  toilet(g, w, d, h, it) {
    const c = M(it.c1, 0.2);
    bx(g, w, 0.4, d * 0.78, 0, 0, 0.06, c, 0.14);
    bx(g, w * 0.92, 0.14, 0.22, 0, 0.36, -d / 2 + 0.11, c, 0.05);
  },
  vanity(g, w, d, h, it) {
    bx(g, w, 0.4, d, 0, 0.42, 0, M(it.c2, 0.6), 0.01);
    bx(g, w, 0.04, d, 0, 0.82, 0, M(it.c1, 0.25), 0.01);
    const xs = it.double ? [-w / 4, w / 4] : [0];
    for (const x of xs) {
      const b = cyl(g, 0.2, 0.17, 0.12, x, 0.86, 0.02, M('#FAFAF8', 0.15), 36); b.scale.z = 0.72;
      cyl(g, 0.012, 0.012, 0.22, x, 0.86, -d / 2 + 0.06, chrome(), 10);
    }
    bx(g, w * 0.92, 0.85, 0.02, 0, 1.15, -d / 2 + 0.01, M('#D9E2E6', 0.02, 1.0), 0, false);
  },
  tub(g, w, d, h, it) {
    bx(g, w, h, d, 0, 0, 0, M(it.c1, 0.15), 0.18);
    bx(g, w - 0.16, 0.02, d - 0.16, 0, h - 0.07, 0, new THREE.MeshPhysicalMaterial({ color: '#9FC9D6', roughness: 0.02, transparent: true, opacity: 0.6 }), 0, false);
  },
  shower(g, w, d, h, it) {
    bx(g, w, 0.04, d, 0, 0, 0, M('#E9E8E4', 0.4));
    bx(g, w, h, 0.01, 0, 0.04, d / 2 - 0.005, glassMat, 0, false);
    bx(g, 0.01, h, d * 0.6, w / 2 - 0.005, 0.04, d / 2 - d * 0.3, glassMat, 0, false);
    cyl(g, 0.12, 0.12, 0.01, 0, 2.05, -d / 2 + 0.3, chrome(), 24);
    cyl(g, 0.01, 0.01, 0.3, 0, 2.05, -d / 2 + 0.05, chrome(), 8).rotation.x = Math.PI / 2;
  },
  appliance(g, w, d, h, it) {
    bx(g, w, h, d, 0, 0, 0, M(it.c1, 0.3, 0.4), 0.01);
    bx(g, 0.02, h * 0.5, 0.02, w / 2 - 0.06, h * 0.4, d / 2 + 0.01, chrome());
  },
  desk(g, w, d, h, it) {
    const met = M(it.c2, 0.25, 0.9);
    for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) cyl(g, 0.012, 0.012, h - 0.03, sx * (w / 2 - 0.03), 0, sz * (d / 2 - 0.03), met, 10);
    for (const s of [-1, 1]) bx(g, w - 0.06, 0.02, 0.02, 0, h - 0.06, s * (d / 2 - 0.03), met);
    bx(g, w, 0.025, d, 0, h - 0.025, 0, M(it.c1, 0.4));
  },
  officeChair(g, w, d, h, it) {
    const met = M(it.c2, 0.25, 0.9);
    cyl(g, 0.3, 0.3, 0.02, 0, 0, 0, met); cyl(g, 0.025, 0.025, 0.4, 0, 0.02, 0, met);
    bx(g, w * 0.82, 0.05, d * 0.75, 0, 0.42, 0.04, M(it.c1, 0.5), 0.02);
    bx(g, w * 0.82, h - 0.48, 0.04, 0, 0.48, -d / 2 + 0.08, M(it.c1, 0.5), 0.02);
    for (const s of [-1, 1]) bx(g, 0.03, 0.03, d * 0.6, s * w * 0.42, 0.6, 0, met);
  },
  bench(g, w, d, h, it) {
    const met = M(it.c2, 0.25, 0.9);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) bx(g, 0.03, h - 0.12, 0.03, sx * (w / 2 - 0.03), 0, sz * (d / 2 - 0.03), met);
    for (let k = 0; k < 3; k++) bx(g, w / 3 - 0.006, 0.11, d, -w / 3 + k * w / 3, h - 0.12, 0, M(it.c1, 0.55), 0.02);
  },
};

const furnGroup = new THREE.Group(); scene.add(furnGroup);
const pickables = [];
for (const it of ITEMS) {
  const [w, d, h] = it.dims.map(v => v / 100);
  const g = new THREE.Group();
  (B[it.type] || B.cabinet)(g, w, d, h, it);
  g.position.set(it.pos[0] * MM, 0.008, it.pos[1] * MM);
  g.rotation.y = it.rot * Math.PI / 180;
  g.userData.item = it;
  g.traverse(o => { if (o.isMesh) pickables.push(o); });
  const el = document.createElement('div');
  const inner = document.createElement('div');
  inner.className = 'fl';
  inner.innerHTML = `${it.brand} <i>· ${it.model.split(' (')[0]}</i>`;
  el.appendChild(inner);
  const lab = new CSS2DObject(el);
  const top = it.type === 'pendant' ? 2.5 : it.type === 'arco' ? 1.3 : (it.elev || 0) + h;
  lab.position.set(0, top + 0.25, 0);
  g.add(lab);
  it.labelEl = inner;
  it.group = g;
  furnGroup.add(g);
}

// Room labels
for (const room of ROOMS) {
  if (!room.label) continue;
  const el = document.createElement('div');
  el.className = 'rl' + (room.dim ? ' dim' : '');
  el.innerHTML = `<b>${room.ko}</b><span>${room.zh}${room.area ? ' · ' + room.area.toFixed(2) + '㎡' : ''}</span>`;
  const o = new CSS2DObject(el);
  o.position.set(room.label[0] * MM, 0.05, room.label[1] * MM);
  scene.add(o);
}

buildWalls(false);

/* ============================================================
   6. SELECTION, VIEWS, UI
   ============================================================ */
const accentColor = () => new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#86653A');
const selBox = new THREE.Box3Helper(new THREE.Box3(), accentColor());
selBox.visible = false; scene.add(selBox);
let selected = null;

const roomById = Object.fromEntries(ROOMS.map(r => [r.id, r]));
const detail = document.getElementById('detail');
function renderDetail(it) {
  const room = roomById[it.room];
  detail.innerHTML = `
    <div class="top"><span class="pill ${it.fixed ? 'fixed' : 'prop'}">${it.fixed ? '확정' : '제안'}</span><span class="pill">${it.cat}</span></div>
    <div><div class="brand">${it.brand}</div><div class="model">${it.model}</div></div>
    <dl class="kv">
      ${it.designer ? `<dt>디자이너</dt><dd>${it.designer}</dd>` : ''}
      <dt>치수</dt><dd class="mono">W ${it.dims[0]} × D ${it.dims[1]} × H ${it.dims[2]} cm</dd>
      <dt>위치</dt><dd>${room.ko} <span style="color:var(--muted)">${room.zh}</span></dd>
    </dl>
    ${it.note ? `<div class="note">${it.note}</div>` : ''}`;
}
function select(it, fly = false) {
  if (selected) { selected.labelEl.classList.remove('sel'); }
  selected = it;
  document.querySelectorAll('.items button').forEach(b => b.setAttribute('aria-current', b.dataset.id === it.id ? 'true' : 'false'));
  it.labelEl.classList.add('sel');
  selBox.box.setFromObject(it.group, true);
  selBox.material.color.copy(accentColor());
  selBox.visible = true;
  renderDetail(it);
  if (fly) focusItem(it);
}

// Schedule list
const scheduleEl = document.getElementById('schedule');
const order = ['living', 'family', 'kitchen', 'foyer', 'lift', 'master', 'cloak', 'mbath', 'bed3', 'bed2', 'bed4', 'balcony', 'bath1', 'bath2', 'bath3', 'equip'];
for (const rid of order) {
  const list = ITEMS.filter(i => i.room === rid); if (!list.length) continue;
  const room = roomById[rid];
  const sec = document.createElement('div'); sec.className = 'room';
  sec.innerHTML = `<div class="room-h"><b>${room.ko}</b><span>${room.zh}${room.area ? ' · ' + room.area.toFixed(2) + '㎡' : ''}</span></div>`;
  const ul = document.createElement('ul'); ul.className = 'items';
  // collapse identical repeats (e.g. 6 dining chairs) into one row
  const seen = new Map();
  for (const it of list) {
    const key = it.brand + '|' + it.model + '|' + it.type;
    if (seen.has(key)) { seen.get(key).count++; continue; }
    seen.set(key, { it, count: 1 });
  }
  for (const { it, count } of seen.values()) {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.id = 'item-' + it.id; b.dataset.id = it.id;
    b.innerHTML = `<span class="b">${it.fixed ? '<span class="star">★ </span>' : ''}${it.brand} <span class="m">${it.model.split(' (')[0]}</span></span>
      <span class="c">${it.cat.replace(/ \d\/6$/, '')}${count > 1 ? ' × ' + count : ''}</span>
      <span class="d">${it.dims[0]}×${it.dims[1]}</span>`;
    b.addEventListener('click', () => select(it, true));
    li.appendChild(b); ul.appendChild(li);
  }
  sec.appendChild(ul); scheduleEl.appendChild(sec);
}
const brands = new Set(ITEMS.map(i => i.brand));
document.getElementById('stats').innerHTML = `
  <div class="stat"><b>${ITEMS.length}</b><span>배치 가구·설비</span></div>
  <div class="stat"><b>${brands.size}</b><span>브랜드</span></div>
  <div class="stat"><b>335㎡</b><span>건축면적 (4房2厅4卫)</span></div>`;

// Camera tween
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let tween = null;
function fly(pos, target, dur = 900) {
  if (reduceMotion) { camera.position.copy(pos); controls.target.copy(target); return; }
  tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: target, start: performance.now(), dur };
}
function topDistance() {
  const v = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return Math.max(26.5 / v, 19 / (v * camera.aspect)) * 1.04;
}
const VIEWS = {
  overview: () => [new THREE.Vector3(CX + 15, 25, CZ + 21), new THREE.Vector3(CX + 0.5, 0, CZ)],
  top: () => [new THREE.Vector3(CX, topDistance(), CZ + 0.01), new THREE.Vector3(CX, 0, CZ)],
  living: () => [new THREE.Vector3(11.4, 5.6, 6.4), new THREE.Vector3(14.6, 0.3, 12.6)],
  dining: () => [new THREE.Vector3(16.6, 3.6, 12.0), new THREE.Vector3(12.8, 0.6, 6.8)],
  master: () => [new THREE.Vector3(18.5, 6.5, 27.0), new THREE.Vector3(15.0, 0, 19.8)],
  beds: () => [new THREE.Vector3(5.5, 9.5, 29.5), new THREE.Vector3(10.2, 0, 21.0)],
};
function setView(name) {
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === name ? 'true' : 'false'));
  const [p, t] = VIEWS[name]();
  // narrow (portrait) screens: back the camera off along the same line of sight
  if (name !== 'top' && camera.aspect < 1.25) p.copy(t.clone().add(p.clone().sub(t).multiplyScalar(Math.pow(1.25 / camera.aspect, 0.75))));
  fly(p, t);
}
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
function focusItem(it) {
  const t = new THREE.Vector3(it.pos[0] * MM, 0.5, it.pos[1] * MM);
  const dir = camera.position.clone().sub(controls.target); dir.y = 0;
  if (dir.lengthSq() < 1e-4) dir.set(0.6, 0, 1);
  dir.normalize().multiplyScalar(4.6);
  fly(new THREE.Vector3(t.x + dir.x, 4.0, t.z + dir.z), t);
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', 'false'));
}

document.getElementById('t-walls').addEventListener('change', e => buildWalls(e.target.checked));
document.getElementById('t-labels').addEventListener('change', e => stage.classList.toggle('show-all', e.target.checked));

// Picking (click without drag)
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  if (!hit) return null;
  let o = hit.object; while (o && !o.userData.item) o = o.parent;
  return o ? o.userData.item : null;
}
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) return;
  const it = pick(e); if (it) select(it, false);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || e.buttons) return;
  renderer.domElement.style.cursor = pick(e) ? 'pointer' : 'grab';
});

// Resize
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + 'px'; renderer.domElement.style.height = h + 'px';
  labelRenderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

// Compass follows camera azimuth (north = −z)
const needle = document.getElementById('needle');
function updateCompass() {
  const az = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
  needle.parentNode.style.transform = `rotate(${(az * 180 / Math.PI).toFixed(1)}deg)`;
}

// Initial state
const [p0, t0] = VIEWS.overview();
if (camera.aspect < 1.25) p0.copy(t0.clone().add(p0.clone().sub(t0).multiplyScalar(Math.pow(1.25 / camera.aspect, 0.75))));
camera.position.copy(p0); controls.target.copy(t0);
select(ITEMS[0], false);
document.getElementById('loading').remove();

function loop(now) {
  if (tween) {
    const k = Math.min(1, (now - tween.start) / tween.dur), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (k >= 1) tween = null;
  }
  controls.update();
  updateCompass();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
